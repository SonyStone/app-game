<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Paint Studio GPU verification</title>
    <style>
      body {
        font: 14px/1.7 system-ui;
        margin: 40px;
        max-width: 1000px;
        color: #20353d;
      }
      button {
        padding: 10px 20px;
      }
      pre {
        white-space: pre-wrap;
        background: #f2f5f4;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <h1>Paint Studio GPU verification</h1>
    <p>Real GPU pixel checks. Uses isolated documents; leaves the studio autosave untouched.</p>
    <button id="readback">Check readback queue</button>
    <button id="brush-batches">Check brush batching</button>
    <button id="active-preview">Check active preview</button>
    <button id="refinement">Check partial refinement</button>
    <button id="overview-quality">Check overview quality</button>
    <button id="large-brush">Check 512px brush</button>
    <button id="pressure">Check stylus pressure</button>
    <button id="persistent-overview">Check saved low-res</button>
    <button id="cold-navigation">Check cold zoom</button>
    <button id="streaming">Run streaming checks</button>
    <button id="run">Run GPU checks</button>
    <button id="worker">Run worker checks</button>
    <button id="lasso">Check lasso selections</button>
    <button id="performance">Measure 60 strokes</button>
    <button id="dense">Measure large document</button>
    <button id="navigation">Measure navigation</button>
    <pre id="output">Ready</pre>
    <script type="module">
      import { verifySelection } from '@app-game/paint/studio/selectionVerification';
      import { verifyPressureSpacing } from '@app-game/paint/studio/gpu/pressureVerification';
      import { verifyReadbackQueue } from '@app-game/paint/studio/gpu/readbackVerification';
      import { verifyBrushBatches } from '@app-game/paint/studio/gpu/brushBatchVerification';
      import { verifyActivePreview } from '@app-game/paint/studio/gpu/activePreviewVerification';
      import { verifyRefinement } from '@app-game/paint/studio/gpu/refinementVerification';
      import { verifyOverviewQuality } from '@app-game/paint/studio/gpu/overviewQualityVerification';
      import { verifyLargeBrush } from '@app-game/paint/studio/gpu/largeBrushVerification';
      import { verifyPersistentOverview } from '@app-game/paint/studio/persistentOverviewVerification';
      import { verifyColdNavigation } from '@app-game/paint/studio/navigationStreamingVerification';
      import { verifyStreaming } from '@app-game/paint/studio/streamingVerification';
      import { verifyGpu } from '@app-game/paint/studio/gpu/verification';
      import { verifyWorker } from '@app-game/paint/studio/workerVerification';
      import { measurePainting, measureDensePainting, measureNavigation } from '@app-game/paint/studio/gpu/performance';
      const button = document.querySelector('#run'),
        output = document.querySelector('#output');
      document.querySelector('#lasso').onclick = async () => {
        output.textContent = 'Testing lasso shaders and large selections…\n';
        try {
          await verifySelection((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#pressure').onclick = async () => {
        output.textContent = 'Testing stylus pressure…\n';
        try {
          await verifyPressureSpacing((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#readback').onclick = async () => {
        output.textContent = 'Testing readback queue…\n';
        try {
          await verifyReadbackQueue((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#brush-batches').onclick = async () => {
        output.textContent = 'Testing brush batches…\n';
        try {
          await verifyBrushBatches((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#active-preview').onclick = async () => {
        output.textContent = 'Testing active preview…\n';
        try {
          await verifyActivePreview((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#refinement').onclick = async () => {
        output.textContent = 'Testing partial refinement…\n';
        try {
          await verifyRefinement((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#overview-quality').onclick = async () => {
        output.textContent = 'Testing thin-line overview quality…\n';
        try {
          await verifyOverviewQuality((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#large-brush').onclick = async () => {
        output.textContent = 'Testing large active brush…\n';
        try {
          await verifyLargeBrush((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#persistent-overview').onclick = async () => {
        output.textContent = 'Testing saved low-resolution pages…\n';
        try {
          await verifyPersistentOverview((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#cold-navigation').onclick = async () => {
        output.textContent = 'Testing cold zoom transitions…\n';
        try {
          await verifyColdNavigation((message) => (output.textContent += message + '\n'));
          output.textContent += 'ALL COLD ZOOM CHECKS PASSED';
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#streaming').onclick = async () => {
        output.textContent = 'Running streaming checks…\n';
        try {
          await verifyStreaming((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      button.onclick = async () => {
        button.disabled = true;
        output.textContent = 'Running…\n';
        try {
          await verifyGpu((message) => {
            output.textContent += message + '\n';
          });
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error) + '\n';
        } finally {
          button.disabled = false;
        }
      };
      document.querySelector('#navigation').onclick = async () => {
        output.textContent = 'Measuring camera movement…\n';
        try {
          await measureNavigation((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      const workerButton = document.querySelector('#worker');
      const denseButton = document.querySelector('#dense');
      denseButton.onclick = async () => {
        denseButton.disabled = true;
        output.textContent = 'Measuring isolated large document…\n';
        try {
          await measureDensePainting((message) => {
            output.textContent += message + '\n';
          });
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error) + '\n';
        } finally {
          denseButton.disabled = false;
        }
      };
      const performanceButton = document.querySelector('#performance');
      performanceButton.onclick = async () => {
        performanceButton.disabled = true;
        output.textContent = 'Measuring isolated large-viewport drawing…\n';
        try {
          await measurePainting((message) => {
            output.textContent += message + '\n';
          });
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error) + '\n';
        } finally {
          performanceButton.disabled = false;
        }
      };
      workerButton.onclick = async () => {
        workerButton.disabled = true;
        output.textContent = 'Running worker checks…\n';
        try {
          await verifyWorker((message) => {
            output.textContent += message + '\n';
          });
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error) + '\n';
        } finally {
          workerButton.disabled = false;
        }
      };
    </script>
  </body>
</html>
