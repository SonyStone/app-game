<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Paint Studio GPU verification</title>
    <style>
      body {
        font: 14px/1.7 system-ui;
        margin: 40px;
        max-width: 1000px;
        color: #20353d;
      }
      button {
        padding: 10px 20px;
      }
      pre {
        white-space: pre-wrap;
        background: #f2f5f4;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <h1>Paint Studio GPU verification</h1>
    <p>Real GPU pixel checks. Uses isolated documents; leaves the studio autosave untouched.</p>
    <button id="readback">Check readback queue</button>
    <button id="brush-batches">Check brush batching</button>
    <button id="active-preview">Check active preview</button>
    <button id="refinement">Check partial refinement</button>
    <button id="overview-quality">Check overview quality</button>
    <button id="large-brush">Check 512px brush</button>
    <button id="pressure">Check stylus pressure</button>
    <button id="stroke-filtering">Check stroke filtering</button>
    <button id="live-tail">Check live stroke tail</button>
    <button id="persistent-overview">Check saved low-res</button>
    <button id="cold-navigation">Check cold zoom</button>
    <button id="streaming">Run streaming checks</button>
    <button id="run">Run GPU checks</button>
    <button id="smudge-performance">Measure dense smudge</button>
    <button id="long-smudge-performance">Measure long smudge</button>
    <button id="huge-smudge-performance">Measure huge smudge</button>
    <button id="mip-batch-performance">Measure batched mipmaps</button>
    <button id="classic-mip-performance">Measure Classic smudge</button>
    <button id="wet-blender-performance">Measure original Wet Blender</button>
    <button id="smudge-multi-dab">Measure Smudge multi-dab batching</button>
    <button id="smudge-dab-batch">Measure Smudge submission batching</button>
    <button id="smudge-responsiveness">Measure Smudge responsiveness</button>
    <button id="abr-mixing">Check ABR color mixing</button>
    <button id="abr-brush">Check ABR presets</button>
    <button id="textured-brush">Check textured brushes</button>
    <button id="canvas-targets">Check canvas targets</button>
    <button id="execution-modes">Check execution modes</button>
    <button id="worker">Run worker checks</button>
    <button id="lasso">Check lasso selections</button>
    <button id="performance">Measure 60 strokes</button>
    <button id="dense">Measure large document</button>
    <button id="navigation">Measure navigation</button>
    <pre id="output">Ready</pre>
    <script type="module">
      import { verifySmudgePerformance } from '../../packages/paint/studio/gpu/smudgePerformanceVerification';
      import { verifyAbrColorMixing } from '../../packages/paint/studio/gpu/abrColorMixingVerification';
      import { verifyAbrBrush } from '../../packages/paint/studio/gpu/abrBrushVerification';
      import { AbrParser } from '../../packages/abr-parser/src/abr-parser';
      import abrExampleUrl from '../abr-viewer/src/assets/examples/spatter_brushes.abr?url';
      import { verifyTexturedBrush } from '@app-game/paint/studio/gpu/texturedBrushVerification';
      import { verifySelection } from '@app-game/paint/studio/selectionVerification';
      import { verifyPressureSpacing } from '@app-game/paint/studio/gpu/pressureVerification';
      import { verifyStrokeFiltering } from '@app-game/paint/studio/gpu/strokeFilteringVerification';
      import { verifyLiveTail } from '@app-game/paint/studio/gpu/liveTailVerification';
      import { verifyReadbackQueue } from '@app-game/paint/studio/gpu/readbackVerification';
      import { verifyBrushBatches } from '@app-game/paint/studio/gpu/brushBatchVerification';
      import { verifyActivePreview } from '@app-game/paint/studio/gpu/activePreviewVerification';
      import { verifyRefinement } from '@app-game/paint/studio/gpu/refinementVerification';
      import { verifyOverviewQuality } from '@app-game/paint/studio/gpu/overviewQualityVerification';
      import { verifyLargeBrush } from '@app-game/paint/studio/gpu/largeBrushVerification';
      import { verifyPersistentOverview } from '@app-game/paint/studio/persistentOverviewVerification';
      import { verifyColdNavigation } from '@app-game/paint/studio/navigationStreamingVerification';
      import { verifyStreaming } from '@app-game/paint/studio/streamingVerification';
      import { verifyGpu } from '@app-game/paint/studio/gpu/verification';
      import { verifyCanvasTargets } from '@app-game/paint/studio/composition/targetVerification';
      import { verifyMainThread } from '@app-game/paint/studio/mainThreadVerification';
      import { verifyWorker } from '@app-game/paint/studio/workerVerification';
      import { measurePainting, measureDensePainting, measureNavigation } from '@app-game/paint/studio/gpu/performance';
      const button = document.querySelector('#run'),
        output = document.querySelector('#output');
      document.querySelector('#textured-brush').onclick = async () => {
        output.textContent = 'Checking textured brushes…\n';
        try {
          await verifyTexturedBrush(
            (message) => (output.textContent += message + '\n'),
            async () => {
              const response = await fetch(abrExampleUrl);
              if (!response.ok) throw new Error('Could not load the repository ABR fixture.');
              const abr = new AbrParser({ extractImages: true }).parse(await response.arrayBuffer());
              const tip = abr.brushes.find((brush) => brush.brushTip?.data.some((value) => value > 0))?.brushTip;
              if (!tip) throw new Error(`No decoded ABR tip: ${abr.errors.join('; ')}`);
              return { id: 'abr-fixture', width: tip.width, height: tip.height, format: 'r8unorm', pixels: tip.data };
            }
          );
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#canvas-targets').onclick = async () => {
        output.textContent = 'Checking shared renderer targets…\n';
        try {
          await verifyCanvasTargets((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#execution-modes').onclick = async () => {
        output.textContent = 'Checking main-thread canvas and worker checkpoints…\n';
        try {
          await verifyMainThread((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#lasso').onclick = async () => {
        output.textContent = 'Testing lasso shaders and large selections…\n';
        try {
          await verifySelection((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#stroke-filtering').onclick = async () => {
        output.textContent = 'Testing stroke filtering…\n';
        try {
          await verifyStrokeFiltering((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#live-tail').onclick = async () => {
        output.textContent = 'Testing live stroke tail…\n';
        try {
          await verifyLiveTail((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#pressure').onclick = async () => {
        output.textContent = 'Testing stylus pressure…\n';
        try {
          await verifyPressureSpacing((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#readback').onclick = async () => {
        output.textContent = 'Testing readback queue…\n';
        try {
          await verifyReadbackQueue((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#brush-batches').onclick = async () => {
        output.textContent = 'Testing brush batches…\n';
        try {
          await verifyBrushBatches((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#active-preview').onclick = async () => {
        output.textContent = 'Testing active preview…\n';
        try {
          await verifyActivePreview((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#refinement').onclick = async () => {
        output.textContent = 'Testing partial refinement…\n';
        try {
          await verifyRefinement((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#overview-quality').onclick = async () => {
        output.textContent = 'Testing thin-line overview quality…\n';
        try {
          await verifyOverviewQuality((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#large-brush').onclick = async () => {
        output.textContent = 'Testing large active brush…\n';
        try {
          await verifyLargeBrush((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#persistent-overview').onclick = async () => {
        output.textContent = 'Testing saved low-resolution pages…\n';
        try {
          await verifyPersistentOverview((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#smudge-performance').onclick = async () => {
        output.textContent = 'Measuring dense smudge…\n';
        try {
          await verifySmudgePerformance((message) => (output.textContent += message + '\n'), { compareReference: true });
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#long-smudge-performance').onclick = async () => {
        output.textContent = 'Measuring long smudge with presentation and eviction…\n';
        try {
          for (const size of [50, 512]) {
            output.textContent += `Brush ${size}px, distance 4096px, cache 16 tiles\n`;
            await verifySmudgePerformance((message) => (output.textContent += message + '\n'),
              { size, distance: 4096, runs: 2, cacheTiles: 16, present: true, compareReference: true });
          }
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#huge-smudge-performance').onclick = async () => {
        output.textContent = 'Measuring large footprints with the production tile-cache budget…\n';
        try {
          for (const size of [512, 2048]) {
            output.textContent += `Brush ${size}px, distance 8192px, production cache budget\n`;
            await verifySmudgePerformance((message) => (output.textContent += message + '\n'),
              { size, distance: 8192, runs: 4, present: true, compareReference: true });
          }
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#mip-batch-performance').onclick = async () => {
        output.textContent = 'Comparing legacy vs cached/demand-generated mipmaps…\n';
        try {
          for (const size of [512, 2048]) {
            output.textContent += `Brush ${size}px, distance 8192px, production cache budget\n`;
            await verifySmudgePerformance((message) => (output.textContent += message + '\n'),
              { size, distance: 8192, runs: 4, present: true, compareReference: true, compareMipBatch: true });
          }
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#classic-mip-performance').onclick = async () => {
        output.textContent = 'Classic color: comparing legacy vs cached/demand-generated mipmaps…\n';
        try {
          for (const size of [512, 2048]) {
            output.textContent += `Brush ${size}px, distance 8192px, production cache budget\n`;
            await verifySmudgePerformance((message) => (output.textContent += message + '\n'),
              { size, distance: 8192, runs: 4, present: true, compareReference: true, compareMipBatch: true, mixing: 'classic' });
          }
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#wet-blender-performance').onclick = async () => {
        output.textContent = 'Loading original Wet Blender preset…\n';
        try {
          const { AbrParser } = await import('../../packages/abr-parser/src/abr-parser');
          const { default: url } = await import('../abr-viewer/src/assets/examples/megapack.abr?url');
          const response = await fetch(url);
          if (!response.ok) throw Error('Could not load megapack.abr');
          const file = new AbrParser().parse(await response.arrayBuffer());
          const preset = file.brushes.find((brush) => brush.name === "Kyle's Paintbox - Wet Blender");
          if (!preset) throw Error('Wet Blender missing');
          for (const size of [50, 512, 2048]) {
            output.textContent += `Real Wet Blender ${size}px, 4096px path, Smooth color\n`;
            await verifySmudgePerformance((message) => (output.textContent += message + '\n'),
              { preset, size, distance: 4096, runs: 4, present: true });
          }
        } catch (error) { output.textContent += 'FAIL: ' + (error.stack ?? error); }
      };
      document.querySelector('#smudge-multi-dab').onclick = async () => {
        output.textContent = 'Comparing one-dab vs bounded multi-dab submissions…\n';
        try {
          for (const size of [50, 512, 2048]) {
            output.textContent += `Brush ${size}px, distance 4096px, Smooth color\n`;
            await verifySmudgePerformance((message) => (output.textContent += message + '\n'),
              { size, distance: 4096, runs: 4, present: true, compareReference: true, compareMultiDab: true });
          }
        } catch (error) { output.textContent += 'FAIL: ' + (error.stack ?? error); }
      };
      document.querySelector('#smudge-dab-batch').onclick = async () => {
        output.textContent = 'Comparing separate vs batched Smudge passes on long strokes…\n';
        try {
          for (const size of [50, 512, 2048]) {
            output.textContent += `Brush ${size}px, distance 4096px, Smooth color\n`;
            await verifySmudgePerformance((message) => (output.textContent += message + '\n'),
              { size, distance: 4096, runs: 4, present: true, compareReference: true, compareDabBatch: true });
          }
        } catch (error) { output.textContent += 'FAIL: ' + (error.stack ?? error); }
      };
      document.querySelector('#smudge-responsiveness').onclick = async () => {
        output.textContent = 'One sparse 8192px pointer segment: comparing progress within the segment…\n';
        try {
          for (const size of [512, 2048]) {
            output.textContent += `Brush ${size}px, Classic\n`;
            await verifySmudgePerformance((message) => (output.textContent += message + '\n'),
              { size, distance: 8192, runs: 2, compareReference: true, compareProgress: true, mixing: 'classic' });
          }
        } catch (error) { output.textContent += 'FAIL: ' + (error.stack ?? error); }
      };
      document.querySelector('#abr-mixing').onclick = async () => {
        output.textContent = 'Checking ABR color mixing…\n';
        try {
          await verifyAbrColorMixing((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#abr-brush').onclick = async () => {
        output.textContent = 'Checking ABR accumulators…\n';
        try {
          await verifyAbrBrush((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#cold-navigation').onclick = async () => {
        output.textContent = 'Testing cold zoom transitions…\n';
        try {
          await verifyColdNavigation((message) => (output.textContent += message + '\n'));
          output.textContent += 'ALL COLD ZOOM CHECKS PASSED';
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      document.querySelector('#streaming').onclick = async () => {
        output.textContent = 'Running streaming checks…\n';
        try {
          await verifyStreaming((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      button.onclick = async () => {
        button.disabled = true;
        output.textContent = 'Running…\n';
        try {
          await verifyGpu((message) => {
            output.textContent += message + '\n';
          });
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error) + '\n';
        } finally {
          button.disabled = false;
        }
      };
      document.querySelector('#navigation').onclick = async () => {
        output.textContent = 'Measuring camera movement…\n';
        try {
          await measureNavigation((message) => (output.textContent += message + '\n'));
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error);
        }
      };
      const workerButton = document.querySelector('#worker');
      const denseButton = document.querySelector('#dense');
      denseButton.onclick = async () => {
        denseButton.disabled = true;
        output.textContent = 'Measuring isolated large document…\n';
        try {
          await measureDensePainting((message) => {
            output.textContent += message + '\n';
          });
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error) + '\n';
        } finally {
          denseButton.disabled = false;
        }
      };
      const performanceButton = document.querySelector('#performance');
      performanceButton.onclick = async () => {
        performanceButton.disabled = true;
        output.textContent = 'Measuring isolated large-viewport drawing…\n';
        try {
          await measurePainting((message) => {
            output.textContent += message + '\n';
          });
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error) + '\n';
        } finally {
          performanceButton.disabled = false;
        }
      };
      workerButton.onclick = async () => {
        workerButton.disabled = true;
        output.textContent = 'Running worker checks…\n';
        try {
          await verifyWorker((message) => {
            output.textContent += message + '\n';
          });
        } catch (error) {
          output.textContent += 'FAIL: ' + (error.stack ?? error) + '\n';
        } finally {
          workerButton.disabled = false;
        }
      };
    </script>
  </body>
</html>
