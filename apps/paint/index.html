<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover makes env(safe-area-inset-*) report the home indicator in a standalone iPad app.
      maximum-scale=1 stops iOS Safari from zooming the page when a text field smaller than 16px gets focus;
      it still lets users zoom for accessibility, and the studio blocks page pinch with touch-action instead.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#344b66" />
    <meta name="description" content="An infinite canvas for drawing and painting." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/icons/paint.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/paint-180.png" />
    <title>Paint Studio</title>
  </head>
  <body style="margin: 0">
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
