name: Paint regressions

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  brush-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Adobe brush packs are downloaded once (scripts/adobe-brush-fixture.mjs verifies each SHA-256); the key changes
      # only when the pinned list does. Derived preset snapshots are keyed by the same digests.
      - uses: actions/cache@v4
        with:
          path: .tmp/adobe-brushes
          key: adobe-brushes-${{ hashFiles('scripts/adobe-brush-fixtures.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @app-game/abr-brush typecheck
      - run: pnpm --filter @app-game/abr-brush test
      - run: pnpm --filter @app-game/abr-paint typecheck
      - run: pnpm --filter @app-game/abr-paint test
      - run: pnpm --filter @app-game/paint-core typecheck
      - run: pnpm --filter @app-game/paint-core test
      - run: pnpm --filter @app-game/navigation-puck typecheck
      - run: pnpm --filter @app-game/navigation-puck test
      - run: pnpm --filter @app-game/brush-preview typecheck
      - run: pnpm --filter @app-game/brush-preview test
      - run: pnpm --filter @app-game/brush-preview-demo build
      - run: pnpm --filter @app-game/paint typecheck
      - run: pnpm --filter @app-game/paint test
      - run: pnpm --filter @app-game/paint test:performance
      # GPU verifications (`pnpm --filter @app-game/paint test:browser`) need a real WebGPU adapter, and GPU timings run on
      # the reference tablet, not GitHub's virtual GPU.
